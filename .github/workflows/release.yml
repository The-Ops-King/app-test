# Builds, tests, signs and publishes the APK on every push to main.
# The app checks releases/latest/download/update.json and updates itself from it.
name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: the commit count is the versionCode

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TOOLBOX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TOOLBOX_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the TOOLBOX_KEYSTORE_BASE64 and TOOLBOX_KEYSTORE_PASSWORD repository secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "TOOLBOX_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          TOOLBOX_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          TOOLBOX_KEYSTORE_PASSWORD: ${{ secrets.TOOLBOX_KEYSTORE_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Verify signature
        run: '"$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${TOOLBOX_VERSION_CODE}"
          TAG="v${VERSION}"
          cp app/build/outputs/apk/release/app-release.apk toolbox.apk
          jq -n \
            --argjson versionCode "$TOOLBOX_VERSION_CODE" \
            --arg versionName "$VERSION" \
            --arg apkUrl "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/toolbox.apk" \
            --arg sha256 "$(sha256sum toolbox.apk | cut -d' ' -f1)" \
            '{versionCode: $versionCode, versionName: $versionName, apkUrl: $apkUrl, sha256: $sha256}' > update.json
          cat update.json
          gh release create "$TAG" toolbox.apk update.json \
            --title "Toolbox ${VERSION}" \
            --notes "Built from ${GITHUB_SHA}." \
            --latest

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
